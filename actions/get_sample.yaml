---
name: get_sample
runner_type: python-script
description: Get sequencing sample from iGene
enabled: true
entry_point: "igene_request.py"
parameters:
  api_key:
    description: iGene API key
    type: string
    secret: true
    default: "{{config_context.api_key}}"
    required: true
  sample_id:
    description: ID of the sample to get.
    type: string
    required: true
  processed:
    description: ID of the sample to get.
    type: boolean
    default: false
  endpoint:
    description: Request URL
    type: string
    default: "worksheets/{% if processed %}{{ 'p' }}{% endif %}seq_sample/{{ sample_id | urlencode }}"
    immutable: true
    required: true
  timeout:
    type: integer
    description: Seconds to timeout
    default: 10
